<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wien Quiz Challenge · Staatsbürgerschaft</title>
<style>
:root{--paper:#f7f3ea;--card:#fffdf8;--ink:#1d1a16;--muted:#6d655a;--line:#e2dacb;--rot:#c8102e;--rot-soft:#f7e3e5;--ok:#2f7a4f;--ok-soft:#e3f1e8;--gold:#d79a1e;--gold-soft:#fbefd2;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--sans:"Avenir Next","Segoe UI Variable","Segoe UI",Candara,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;background-image:repeating-linear-gradient(0deg,transparent 0 31px,rgba(0,0,0,.025) 31px 32px);overflow-x:hidden}
.flag{height:10px;background:linear-gradient(var(--rot) 0 33.3%,#fff 33.3% 66.6%,var(--rot) 66.6%)}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 96px}
nav{display:flex;gap:8px;font-size:14px;flex-wrap:wrap}
nav a{color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff}
nav a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:20px;box-shadow:0 8px 24px -16px rgba(60,40,20,.25)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,6vw,46px);line-height:1.05;margin:18px 0 4px}
h2{font-family:var(--serif);font-weight:600;font-size:21px;margin:0 0 10px}
.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--rot);font-weight:700}
.sub{color:var(--muted);font-size:14px;margin:0}
/* profile */
.profile{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.rank{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:var(--gold-soft);border:3px solid var(--gold)}
.rname{font-family:var(--serif);font-size:22px;font-weight:600}
.xpbar{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin:6px 0 4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--rot));transition:width .6s}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;font-size:11px;color:var(--muted)}
.stat b{display:block;font-family:var(--serif);font-size:22px;color:var(--ink)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mode{all:unset;cursor:pointer;border:1.5px solid var(--line);border-radius:12px;padding:14px;background:#fff;transition:.15s}
.mode:hover{border-color:var(--rot);transform:translateY(-2px)}
.mode b{font-family:var(--serif);font-size:18px;display:block}
.mode span{font-size:13px;color:var(--muted)}
.rules{font-size:14px;color:var(--muted);margin:14px 0 0;padding-left:18px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.badge{border:1px dashed var(--line);border-radius:10px;padding:10px;text-align:center;font-size:12px;color:var(--muted);background:#fff}
.badge .e{font-size:26px;display:block;filter:grayscale(1);opacity:.35}
.badge b{display:block;color:var(--ink);font-size:13px}
.badge.got{border:1.5px solid var(--gold);background:var(--gold-soft)}
.badge.got .e{filter:none;opacity:1}
/* game HUD */
.hud{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.hearts{font-size:22px;letter-spacing:2px}
.score{font-family:var(--serif);font-size:28px;font-weight:700;text-align:center}
.combo{font-weight:800;font-size:14px;padding:4px 10px;border-radius:999px;background:var(--line);color:var(--muted);transition:.2s}
.combo.hot{background:var(--rot);color:#fff;transform:scale(1.08)}
.timer{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:14px 0 16px}
.timer i{display:block;height:100%;background:var(--ok);transition:width 1s linear,background .3s}
.timer i.low{background:var(--rot)}
.tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:4px;background:var(--rot-soft);color:var(--rot)}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);align-items:center}
.qtext{font-family:var(--serif);font-size:clamp(20px,3.4vw,24px);line-height:1.3;margin:10px 0 0}
.en{font-size:14px;color:var(--muted);font-style:italic;margin:4px 0 0}
.howmany{font-size:13px;font-weight:700;color:var(--gold);margin-top:8px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:#fff;transition:.12s}
.opt .k{flex:none;width:24px;height:24px;border-radius:6px;border:2px solid #9c9180;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--muted)}
.opt.sel{border-color:var(--ink)}.opt.sel .k{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--rot);background:var(--rot-soft)}
.opt.missed{border-style:dashed;border-color:var(--ok)}
.opt.locked{cursor:default}
.row{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;padding:12px 20px;border-radius:10px;font-weight:700;background:var(--ink);color:#fff;text-align:center}
.btn:hover{background:var(--rot)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.btn[disabled]{opacity:.35;pointer-events:none}
.jokers{display:flex;gap:8px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px}
.fb.good{background:var(--ok-soft)}.fb.bad{background:var(--rot-soft)}.fb.part{background:var(--gold-soft)}
.fb b{display:block}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:800;font-size:44px;color:var(--rot);pointer-events:none;animation:pop 1s ease-out forwards;z-index:9;text-shadow:0 2px 0 #fff}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.confetti{position:fixed;top:-20px;font-size:22px;pointer-events:none;animation:fall linear forwards;z-index:8}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.over{text-align:center}
.stamp{display:inline-block;font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:6px 18px;border:3px solid var(--rot);color:var(--rot);border-radius:8px;transform:rotate(-3deg);margin-top:6px}
.big{font-family:var(--serif);font-size:54px;font-weight:700;margin:8px 0 0;line-height:1}
.newrec{color:var(--gold);font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:13px}
.earn{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:12px 0}
.earn b{color:var(--ink)}
.miss{border-top:1px solid var(--line);padding:12px 0;text-align:left}
.miss p{margin:4px 0;font-family:var(--serif);font-size:16px}
.miss .c{color:var(--ok);font-weight:600;font-size:14px}
.miss .x{color:var(--muted);font-size:13px}
.newbadge{display:inline-block;background:var(--gold-soft);border:1.5px solid var(--gold);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:700;margin:3px}
.hidden{display:none}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.modes{grid-template-columns:minmax(0,1fr)}.score{font-size:22px}}
@media print{.flag,nav,.row,.modes{display:none}.card{box-shadow:none;break-inside:avoid}body{background-image:none}}
</style>
</head>

<div class="flag"></div>
<div class="wrap">

  <main id="app"></main>
</div>
<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="game.js"></script>
</body>
</html>
